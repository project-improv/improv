      - DimReduction.q_out
    sinks:
      - Bubblewrap.q_in
  
  Reducer-GUI:
    sources:
      - DimReduction.v_out
    sinks:
      - GUI.q_in
  
  Bubblewrapper-GUI:
    sources:
      - Bubblewrap.q_out
    sinks:
      - GUI.bw_in
